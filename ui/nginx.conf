server {
    listen 80;

    location /api/ {
        proxy_pass http://alert_auth:8020/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /ws {
        proxy_pass http://alert_auth:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Internal auth endpoint — checks Authorization header OR third_token cookie.
    location = /_auth {
        internal;
        set $auth_token $http_authorization;
        if ($http_authorization = "") {
            set $auth_token $cookie_third_token;
        }
        proxy_pass http://alert_auth:8020/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $auth_token;
        proxy_set_header X-Original-URI $request_uri;
    }

    # RabbitMQ session endpoint — verifies JWT then logs into RabbitMQ as guest.
    location = /_rabbitmq-session {
        internal;
        set $auth_token $http_authorization;
        if ($http_authorization = "") {
            set $auth_token $cookie_third_token;
        }
        proxy_pass http://alert_auth:8020/rabbitmq/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $auth_token;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /grafana/ {
        auth_request /_auth;
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        auth_request /_auth;
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /jaeger/ {
        auth_request /_auth;
        proxy_pass http://jaeger:16686/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        sub_filter '<base href="/" data-inject-target="BASE_URL" />' '<base href="/jaeger/" data-inject-target="BASE_URL" />';
        sub_filter_once on;
    }

    location /rabbitmq/ {
        auth_request /_rabbitmq-session;
        auth_request_set $rmq_cookie $upstream_http_set_cookie;

        proxy_pass http://rabbitmq:15672/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_domain rabbitmq:15672 $host;
        proxy_cookie_path / /rabbitmq/;
        # Strip any Set-Cookie from RabbitMQ's response and only inject our session cookie.
        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $rmq_cookie always;
    }

    location = /links {
        auth_request /_auth;
        alias /usr/share/nginx/html/links.html;
        default_type text/html;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
