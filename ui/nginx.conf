server {
    listen 80;

    location /api/ {
        proxy_pass http://alert_auth:8020/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /ws {
        proxy_pass http://alert_auth:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /jaeger/ {
        proxy_pass http://jaeger:16686/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /links {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Third — Service Links</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { max-width: 640px; width: 100%; padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.875rem; }
  .section { margin-bottom: 1.5rem; }
  .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; margin-bottom: 0.75rem; }
  .links { display: flex; flex-direction: column; gap: 0.5rem; }
  a { display: block; padding: 0.75rem 1rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #e2e8f0; text-decoration: none; transition: background 0.15s, border-color 0.15s; }
  a:hover { background: #334155; border-color: #475569; }
  .label { font-weight: 600; }
  .desc { color: #94a3b8; font-size: 0.8rem; margin-top: 0.15rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Third</h1>
  <p class="subtitle">Distributed Energy Management Platform</p>

  <div class="section">
    <div class="section-title">Application</div>
    <div class="links">
      <a href="/"><span class="label">UI Dashboard</span><div class="desc">Live telemetry, alerts, rules</div></a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Observability</div>
    <div class="links">
      <a href="/grafana/"><span class="label">Grafana</span><div class="desc">Dashboards &mdash; admin / admin</div></a>
      <a href="/prometheus/"><span class="label">Prometheus</span><div class="desc">Metrics queries</div></a>
      <a href="/jaeger/"><span class="label">Jaeger</span><div class="desc">Distributed traces</div></a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Infrastructure</div>
    <div class="links">
      <a href="http://localhost:15672"><span class="label">RabbitMQ Management</span><div class="desc">Queues, exchanges &mdash; guest / guest</div></a>
    </div>
  </div>
</div>
</body>
</html>';
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
