global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ingest"
    static_configs:
      - targets: ["ingest:8000"]

  - job_name: "telemetry"
    static_configs:
      - targets: ["telemetry:8010"]

  - job_name: "alert_auth"
    static_configs:
      - targets: ["alert_auth:8020"]
