services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # for code
      - "15672:15672" # UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.54.0
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  mock:
    build: .
    command: ["uv", "run", "uvicorn", "app.mock_server.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"

  ingest:
    build: .
    command:
      - sh
      - -c
      - "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mock:
        condition: service_started
    environment:
      THIRD_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      THIRD_CONFIG_PATH: /app/config.docker.yaml
      OTEL_SERVICE_NAME: ingest
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8000:8000"

  telemetry:
    build: .
    command:
      - sh
      - -c
      - "uv run alembic -c services/telemetry/alembic.ini upgrade head && uv run uvicorn services.telemetry.app.main:app --host 0.0.0.0 --port 8010"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      TELEMETRY_DATABASE_URL: postgresql+asyncpg://telemetry:telemetry@postgres:5432/telemetry
      TELEMETRY_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      TELEMETRY_REDIS_URL: redis://redis:6379/0
      OTEL_SERVICE_NAME: telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8010:8010"

  alert_auth:
    build: .
    command:
      - sh
      - -c
      - "uv run alembic -c services/alert_auth/alembic.ini upgrade head && uv run uvicorn services.alert_auth.main:app --host 0.0.0.0 --port 8020"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ALERTAUTH_DATABASE_URL: postgresql+asyncpg://telemetry:telemetry@postgres:5432/alertauth
      ALERTAUTH_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ALERTAUTH_REDIS_URL: redis://redis:6379/0
      ALERTAUTH_JWT_SECRET: dev-only-secret-key-change-me-in-production-0001
      OTEL_SERVICE_NAME: alert_auth
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8020:8020"

  ui:
    build: ./ui
    depends_on:
      - alert_auth
    ports:
      - "3000:80"

volumes:
  pgdata:
